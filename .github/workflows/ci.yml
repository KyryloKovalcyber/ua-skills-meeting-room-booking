name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Tests, types and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: "file:./ci.db"
      TEST_DATABASE_URL: "file:./test.db"
      SESSION_COOKIE_NAME: "meeting_session"
      SESSION_TTL_DAYS: "14"
      OFFICE_TIME_ZONE: "Europe/Kyiv"
      OFFICE_OPEN_HOUR: "9"
      OFFICE_CLOSE_HOUR: "19"
      APP_URL: "http://localhost:3000"
      EMAIL_VERIFICATION_TTL_MINUTES: "30"
      NOTIFY_BEFORE_MINUTES: "10"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate clean-machine setup
        run: npm run setup:all

      - name: Run quality gate
        run: npm run check
